name: Build Custom Briar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Change wrapper permissions
        run: chmod +x gradlew

      - name: Fix Manifest and Disable Resource Validation
        run: |
          # 1. Użycie skryptu Python do bezbłędnej modyfikacji XML bez uszkadzania struktury pliku manifestu
          python3 -c "
          import xml.etree.ElementTree as ET
          
          manifest_path = 'briar-android/src/main/AndroidManifest.xml'
          
          # Zarejestruj przestrzenie nazw, aby zachować poprawny format XML
          ET.register_namespace('android', 'http://android.com')
          ET.register_namespace('tools', 'http://android.com')
          
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          
          # Dodaj przestrzeń nazw tools do głównego tagu manifest
          root.set('xmlns:tools', 'http://android.com')
          
          # Znajdź element application i dodaj regułę replace dla allowBackup
          application = root.find('application')
          if application is not None:
              application.set('{http://android.com}replace', 'android:allowBackup')
              application.set('{http://android.com}allowBackup', 'true')
          
          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          "
          
          # 2. Blokada przerywania kompilacji przez błędy w plikach strings.xml (Tłumaczenia)
          # Przekazujemy flagi wyłączające rygorystyczne sprawdzanie dla Lint i AAPT2
          echo "android.experimental.disableResourcesValidation=true" >> gradle.properties
          echo "android.disableResourceValidation=true" >> gradle.properties
          
          # Dodatkowo konfigurujemy lintOptions globalnie w plikach build.gradle jeśli istnieją
          find . -name "build.gradle" -exec sh -c 'echo "android { lintOptions { abortOnError false; checkReleaseBuilds false } }" >> "$1"' _ {} \;

      - name: Build Debug APK
        run: ./gradlew :briar-android:assembleDebug --no-daemon -Pandroid.experimental.disableResourcesValidation=true -Pandroid.disableResourceValidation=true

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Briar-Custom-APK
          path: briar-android/build/outputs/apk/debug/*.apk
