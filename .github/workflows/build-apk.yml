name: Build Custom Briar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Change wrapper permissions
        run: chmod +x gradlew

      - name: Fix Manifest Merger and Strings Conflict
        run: |
          # 1. Dodaj przestrzeń nazw tools do tagu <manifest>
          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/://android.com\/tools"/' briar-android/src/main/AndroidManifest.xml
          
          # 2. Dodaj tools:replace do tagu <application> aby rozwiazac konflikt allowBackup
          sed -i 's/<application/<application tools:replace="android:allowBackup"/' briar-android/src/main/AndroidManifest.xml
          
          # 3. Wycisz rygorystyczne bledy formatowania w strings.xml modyfikujac gradle.properties
          echo "android.disableResourceValidation=true" >> gradle.properties

      - name: Build Debug APK
        run: ./gradlew :briar-android:assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Briar-Custom-APK
          path: briar-android/build/outputs/apk/debug/*.apk
